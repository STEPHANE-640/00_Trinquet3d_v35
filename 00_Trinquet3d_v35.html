<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trinquet 3D — Simulateur de coups</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0a0c12; overflow: hidden; }
  #container { position: fixed; inset: 0; }

  #panel {
    position: fixed; top: 12px; right: 12px; width: 300px;
    display: flex; flex-direction: column; gap: 6px;
    max-height: calc(100vh - 24px); overflow-y: auto;
    scrollbar-width: thin; scrollbar-color: #333 transparent;
    z-index: 10;
  }
  .shot-btn {
    display: flex; flex-direction: column; padding: 10px 14px;
    border: 1px solid #2a2d38; border-radius: 8px; background: #12141cdd;
    cursor: pointer; transition: all .15s; backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .shot-btn:hover { background: #1a1e2add; border-color: #3a3f52; }
  .shot-btn.active { border-color: var(--c); box-shadow: 0 0 12px color-mix(in srgb, var(--c) 25%, transparent); }
  .shot-btn .name { font-weight: 600; font-size: .88rem; color: #eee; }
  .shot-btn .es { color: #888; font-weight: 400; font-size: .78rem; }
  .shot-btn .desc { font-size: .72rem; color: #999; line-height: 1.35; margin-top: 3px; }

  #cameras {
    position: fixed; top: 12px; left: 12px; display: flex; gap: 6px;
    flex-wrap: wrap; max-width: 440px; z-index: 10;
  }
  #cameras button {
    padding: 6px 12px; border: 1px solid #2a2d38; border-radius: 6px;
    background: #12141cdd; color: #bbb; cursor: pointer; font-size: .75rem;
    transition: all .15s; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  #cameras button:hover { background: #1e2230dd; color: #fff; }
  #cameras button.active { border-color: #4a7cff; color: #4a7cff; }

  #controls {
    position: fixed; bottom: 12px; left: 12px; display: flex; gap: 8px;
    align-items: center; z-index: 10;
  }
  #controls button {
    padding: 7px 16px; border: 1px solid #2a2d38; border-radius: 6px;
    background: #12141cdd; color: #ccc; cursor: pointer; font-size: .78rem;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); transition: all .15s;
  }
  #controls button:hover { background: #1e2230dd; color: #fff; }
  #dimBtn.active { border-color: #ccaa00; color: #ccaa00; }
  #editToggle.active { border-color: #7ec8ff; color: #7ec8ff; }

  #editor {
    position: fixed; right: 12px; bottom: 12px; width: 300px;
    border: 1px solid #2a2d38; border-radius: 8px; background: #12141cdd;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px; z-index: 10; display: none;
  }
  #editor.visible { display: block; }
  #editor .row { display: flex; gap: 6px; margin-top: 6px; }
  #editor .row label { flex: 1; font-size: .68rem; color: #95a0b6; display: flex; flex-direction: column; gap: 3px; }
  #editor .title { color: #ccd5e5; font-size: .78rem; font-weight: 600; }
  #editor input {
    width: 100%; background: #0e1118; color: #d8deeb; border: 1px solid #2a2d38;
    border-radius: 5px; padding: 4px 6px; font-size: .72rem;
  }
  #editor .btns { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  #editor button {
    padding: 6px 8px; border: 1px solid #2a2d38; border-radius: 6px;
    background: #12141cdd; color: #c9d0dd; cursor: pointer; font-size: .72rem;
  }
  #editor button:hover { background: #1e2230dd; color: #fff; }

  #title {
    position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
    color: #ffffff50; font-size: .7rem; z-index: 10; text-align: center;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="container"></div>

<div id="cameras">
  <button data-cam="default" class="active">Vue 3/4</button>
  <button data-cam="side">Côté (Vitre)</button>
  <button data-cam="player">Vue joueur</button>
  <button data-cam="gallery">Galerie (Tejadillo)</button>
</div>

<div id="panel"></div>

<div id="controls">
  <button id="replay">&#x25B6; Rejouer</button>
  <button id="speed">Vitesse : 1x</button>
  <button id="pause">Pause</button>
  <button id="dimBtn">Dimensions</button>
  <button id="editToggle">Éditer le coup</button>
</div>

<div id="editor">
  <div class="title">Éditeur de coup</div>
  <div class="row">
    <label>pos.x <input id="ed_pos_x" type="number" step="0.1"></label>
    <label>pos.y <input id="ed_pos_y" type="number" step="0.1"></label>
    <label>pos.z <input id="ed_pos_z" type="number" step="0.1"></label>
  </div>
  <div class="row">
    <label>horiz ° <input id="ed_angle_h" type="number" step="1"></label>
    <label>vert ° <input id="ed_angle_v" type="number" step="1"></label>
  </div>
  <div class="row">
    <label>puissance <input id="ed_strength" type="number" step="0.1"></label>
  </div>
  <div class="btns">
    <label style="display:flex;align-items:center;gap:6px;color:#aeb8cc;font-size:.72rem;padding-right:8px;">
      <input id="ed_live" type="checkbox" checked style="width:auto;">
      Appliquer en direct
    </label>
    <button id="ed_apply">Appliquer</button>
    <button id="ed_export">Exporter JSON</button>
    <button id="ed_import_btn">Importer JSON</button>
    <input id="ed_import_file" type="file" accept="application/json" style="display:none">
  </div>
</div>

<div id="title">Glisser pour orbiter &middot; Molette pour zoomer &middot; Clic droit pour déplacer</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.162.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.162.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── Dimensions du trinquet (mètres) ──
const COURT_L = 28.5, COURT_W = 9.3, COURT_H = 9.5;
const FRAILE_W = 0.47;
const TEJ_D = 1.3, TEJ_H_OUTER = 1.9, TEJ_H_INNER = 2.25;
const CHAPA_LOW = 0.8, CHAPA_HIGH = 8.5, CHAPA_REBOTE = 5.5;
const WALL_STEP_X = 4.5, WALL_H_FRONT = 8.5, WALL_H_BACK = 5.5;
const TEJ_Z = COURT_W - TEJ_D;
const FRONTIS_H = 10;
const W = COURT_W;
const NET_START = 4.5;
const NET_END = 25.2;
const POLE_X = [4.5, 7.25, 10.0, 12.5, 15.0, 17.5, 20.0, 22.6, 25.2];

// ── Scène ──
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0c12);
scene.fog = new THREE.FogExp2(0x0a0c12, 0.008);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.getElementById('container').appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(30, 13, 0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(10, 2, 5);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.update();

// ── Lumières ──
scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const dirLight = new THREE.DirectionalLight(0xfff8e8, 1.2);
dirLight.position.set(14, 20, 5);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(2048, 2048);
Object.assign(dirLight.shadow.camera, { left: -20, right: 35, top: 15, bottom: -5, near: 1, far: 50 });
scene.add(dirLight);
scene.add(new THREE.DirectionalLight(0xb0c0ff, 0.3).translateX(-5).translateY(10).translateZ(10));

// ── Matériaux ──

// Chapa : jaune vif avec forte émission
const chapaMat = new THREE.MeshStandardMaterial({
  color: 0xffdd00,
  emissive: 0xffaa00,
  emissiveIntensity: 0.9,
  roughness: 0.15,
  metalness: 0.6,
});

const mat = {
  floor:    new THREE.MeshStandardMaterial({ color: 0x1a3828, roughness: 0.85 }),
  frontis:  new THREE.MeshStandardMaterial({ color: 0xb8a898, roughness: 0.6 }),
  rebote:   new THREE.MeshStandardMaterial({ color: 0xa09080, roughness: 0.6 }),
  wall:     new THREE.MeshStandardMaterial({ color: 0xa89888, roughness: 0.6 }),
  glass:    new THREE.MeshStandardMaterial({ color: 0x88bbdd, roughness: 0.1, transparent: true, opacity: 0.06, side: THREE.DoubleSide }),
  fraile:   new THREE.MeshStandardMaterial({ color: 0xd4a040, roughness: 0.4, side: THREE.DoubleSide }),
  tejRoof:  new THREE.MeshStandardMaterial({ color: 0x705838, roughness: 0.7, side: THREE.DoubleSide }),
  tejWall:  new THREE.MeshStandardMaterial({ color: 0x807060, roughness: 0.6 }),
  chapa:    chapaMat,
  net:      new THREE.MeshStandardMaterial({ color: 0x9060b0, transparent: true, opacity: 0.35, side: THREE.DoubleSide }),
  line:     new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x444444, transparent: true, opacity: 0.5 }),
  padding:  new THREE.MeshStandardMaterial({ color: 0x332222, roughness: 0.95 }),
  oreille:  new THREE.MeshStandardMaterial({ color: 0x882828, emissive: 0x441111, roughness: 0.7 }),
};

function box(w, h, d, material) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}

function addEdge(pts, color = 0x446688, opacity = 0.3) {
  const g = new THREE.BufferGeometry().setFromPoints(pts.map(p => new THREE.Vector3(...p)));
  scene.add(new THREE.Line(g, new THREE.LineBasicMaterial({ color, transparent: true, opacity })));
}

function addChapaLine(points) {
  const geo = new THREE.BufferGeometry().setFromPoints(
    points.map(p => new THREE.Vector3(...p))
  );
  const line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color: 0xffee00 }));
  scene.add(line);
}

// ── Sol ──
const floor = box(COURT_L, 0.12, COURT_W, mat.floor);
floor.position.set(COURT_L/2, -0.06, COURT_W/2);
scene.add(floor);

[10, 15, 17.5, 20].forEach(d => {
  const l = box(0.08, 0.005, COURT_W, mat.line);
  l.position.set(d, 0.005, COURT_W/2);
  scene.add(l);
});
const perpLine = box(COURT_L - 15, 0.005, 0.08, mat.line);
perpLine.position.set(15 + (COURT_L - 15)/2, 0.005, COURT_W/2);
scene.add(perpLine);

// ── Frontis (x=0) ──
const frontis = box(0.35, FRONTIS_H, COURT_W, mat.frontis);
frontis.position.set(-0.175, FRONTIS_H/2, COURT_W/2);
scene.add(frontis);

const padAbove = box(0.36, FRONTIS_H - CHAPA_HIGH, COURT_W, mat.padding);
padAbove.position.set(-0.175, CHAPA_HIGH + (FRONTIS_H - CHAPA_HIGH)/2, COURT_W/2);
scene.add(padAbove);

const oreilleH = WALL_H_FRONT - WALL_H_BACK;

// Chapa basse du frontis
const chapaLow = box(0.12, 0.20, COURT_W + 0.1, mat.chapa);
chapaLow.position.set(0.06, CHAPA_LOW + 0.10, COURT_W/2);
scene.add(chapaLow);
addChapaLine([[0.13, CHAPA_LOW, 0], [0.13, CHAPA_LOW, COURT_W]]);
addChapaLine([[0.13, CHAPA_LOW + 0.10, 0], [0.13, CHAPA_LOW + 0.10, COURT_W]]);
addChapaLine([[0.13, CHAPA_LOW + 0.20, 0], [0.13, CHAPA_LOW + 0.20, COURT_W]]);

// Chapa haute du frontis
const chapaHigh = box(0.12, 0.18, COURT_W + 0.1, mat.chapa);
chapaHigh.position.set(0.06, CHAPA_HIGH + 0.09, COURT_W/2);
scene.add(chapaHigh);
addChapaLine([[0.13, CHAPA_HIGH, 0], [0.13, CHAPA_HIGH, COURT_W]]);
addChapaLine([[0.13, CHAPA_HIGH + 0.09, 0], [0.13, CHAPA_HIGH + 0.09, COURT_W]]);
addChapaLine([[0.13, CHAPA_HIGH + 0.18, 0], [0.13, CHAPA_HIGH + 0.18, COURT_W]]);

const padBelow = box(0.36, CHAPA_LOW, COURT_W, mat.padding);
padBelow.position.set(-0.175, CHAPA_LOW/2, COURT_W/2);
scene.add(padBelow);

// ── Zones cibles du frontis ──
const ZONE_Y_MID = (CHAPA_LOW + CHAPA_HIGH) / 2;
const ZONE_Z_MID = COURT_W / 2;
const ZONE_H = (CHAPA_HIGH - CHAPA_LOW) / 2;
const ZONE_W_HALF = COURT_W / 2;

const zonesDef = [
  { id: 1, label: '1', yC: ZONE_Y_MID + ZONE_H/2, zC: ZONE_Z_MID + ZONE_W_HALF/2 },
  { id: 2, label: '2', yC: ZONE_Y_MID + ZONE_H/2, zC: ZONE_Z_MID - ZONE_W_HALF/2 },
  { id: 3, label: '3', yC: ZONE_Y_MID - ZONE_H/2, zC: ZONE_Z_MID + ZONE_W_HALF/2 },
  { id: 4, label: '4', yC: ZONE_Y_MID - ZONE_H/2, zC: ZONE_Z_MID - ZONE_W_HALF/2 },
];

const zones = [];
const hitZones = new Set();
const zoneBorderMat = new THREE.LineBasicMaterial({ color: 0x4488cc, transparent: true, opacity: 0.25 });

for (const zd of zonesDef) {
  const zm = new THREE.MeshStandardMaterial({
    color: 0x4488cc, transparent: true, opacity: 0.06,
    emissive: 0x000000, roughness: 0.5, side: THREE.DoubleSide,
  });
  const zh = ZONE_H - 0.1, zw = ZONE_W_HALF - 0.1;
  const mesh = box(0.02, zh, zw, zm);
  mesh.position.set(0.02, zd.yC, zd.zC);
  scene.add(mesh);

  const by0 = zd.yC - zh/2, by1 = zd.yC + zh/2;
  const bz0 = zd.zC - zw/2, bz1 = zd.zC + zw/2;
  const bx = 0.03;
  scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(bx,by0,bz0), new THREE.Vector3(bx,by1,bz0),
    new THREE.Vector3(bx,by1,bz1), new THREE.Vector3(bx,by0,bz1),
    new THREE.Vector3(bx,by0,bz0),
  ]), zoneBorderMat));

  const sp = createSprite(zd.label, [0.05, zd.yC, zd.zC], '#4488cc', 1.8);
  scene.add(sp);

  zones.push({ ...zd, mesh, mat: zm, sprite: sp });
}

function checkZoneHit(pos) {
  if (pos.x > 0.5) return;
  for (const z of zones) {
    if (hitZones.has(z.id)) continue;
    if (Math.abs(pos.y - z.yC) < ZONE_H/2 && Math.abs(pos.z - z.zC) < ZONE_W_HALF/2) {
      hitZones.add(z.id);
      z.mat.opacity = 0.3;
      z.mat.emissive.set(0x2266aa);
      z.sprite.material.opacity = 1.0;
    }
  }
}

function resetZones() {
  hitZones.clear();
  for (const z of zones) {
    z.mat.opacity = 0.06;
    z.mat.emissive.set(0x000000);
    z.sprite.material.opacity = 0.7;
  }
}

// ── Rebote (x=28.5) ──
const rebote = box(0.3, WALL_H_BACK, COURT_W, mat.rebote);
rebote.position.set(COURT_L + 0.15, WALL_H_BACK/2, COURT_W/2);
scene.add(rebote);

// Chapa du rebote
const chapaReb = box(0.12, 0.18, COURT_W + 0.1, mat.chapa);
chapaReb.position.set(COURT_L - 0.06, CHAPA_REBOTE + 0.09, COURT_W/2);
scene.add(chapaReb);
addChapaLine([[COURT_L - 0.13, CHAPA_REBOTE, 0], [COURT_L - 0.13, CHAPA_REBOTE, COURT_W]]);
addChapaLine([[COURT_L - 0.13, CHAPA_REBOTE + 0.09, 0], [COURT_L - 0.13, CHAPA_REBOTE + 0.09, COURT_W]]);
addChapaLine([[COURT_L - 0.13, CHAPA_REBOTE + 0.18, 0], [COURT_L - 0.13, CHAPA_REBOTE + 0.18, COURT_W]]);

// ── Chapa mur GAUCHE (z=COURT_W) ──
const chapaLeftMainLen = COURT_L - WALL_STEP_X;
const chapaLeftWall = box(chapaLeftMainLen, 0.18, 0.12, mat.chapa);
chapaLeftWall.position.set(WALL_STEP_X + chapaLeftMainLen/2, CHAPA_REBOTE + 0.09, COURT_W - 0.06);
scene.add(chapaLeftWall);

const chapaLeftFaceH = WALL_H_FRONT - CHAPA_REBOTE;
const chapaLeftFace = box(0.18, chapaLeftFaceH, 0.12, mat.chapa);
chapaLeftFace.position.set(WALL_STEP_X, CHAPA_REBOTE + chapaLeftFaceH/2, COURT_W - 0.06);
scene.add(chapaLeftFace);

const chapaLeftTop = box(WALL_STEP_X + 0.1, 0.18, 0.12, mat.chapa);
chapaLeftTop.position.set(WALL_STEP_X/2, WALL_H_FRONT + 0.09, COURT_W - 0.06);
scene.add(chapaLeftTop);

// ── Chapa mur DROIT (z=0) ──
const chapaRightMainLen = COURT_L - WALL_STEP_X;
const chapaRightWall = box(chapaRightMainLen, 0.18, 0.12, mat.chapa);
chapaRightWall.position.set(WALL_STEP_X + chapaRightMainLen/2, CHAPA_REBOTE + 0.09, 0.06);
scene.add(chapaRightWall);

const chapaRightFaceH = WALL_H_FRONT - CHAPA_REBOTE;
const chapaRightFace = box(0.18, chapaRightFaceH, 0.12, mat.chapa);
chapaRightFace.position.set(WALL_STEP_X, CHAPA_REBOTE + chapaRightFaceH/2, 0.06);
scene.add(chapaRightFace);

const chapaRightTop = box(WALL_STEP_X + 0.1, 0.18, 0.12, mat.chapa);
chapaRightTop.position.set(WALL_STEP_X/2, WALL_H_FRONT + 0.09, 0.06);
scene.add(chapaRightTop);

// ── Mur GAUCHE ──
const lwLowerH = WALL_H_BACK - TEJ_H_INNER;
const lw1_lower = box(WALL_STEP_X, lwLowerH, 0.3, mat.wall);
lw1_lower.position.set(WALL_STEP_X/2, TEJ_H_INNER + lwLowerH/2, COURT_W + 0.15);
scene.add(lw1_lower);

const oreilleLeftMat = mat.oreille.clone();
const oreilleLeft = box(WALL_STEP_X, oreilleH, 0.3, oreilleLeftMat);
oreilleLeft.position.set(WALL_STEP_X/2, WALL_H_BACK + oreilleH/2, COURT_W + 0.15);
scene.add(oreilleLeft);

const lwH2 = WALL_H_BACK - TEJ_H_INNER;
const lw2 = box(COURT_L - WALL_STEP_X, lwH2, 0.3, mat.wall);
lw2.position.set(WALL_STEP_X + (COURT_L - WALL_STEP_X)/2, TEJ_H_INNER + lwH2/2, COURT_W + 0.15);
scene.add(lw2);

const stepFace = box(0.3, oreilleH, 0.3, mat.oreille);
stepFace.position.set(WALL_STEP_X, WALL_H_BACK + oreilleH/2, COURT_W + 0.15);
scene.add(stepFace);

// ── Mur DROIT ──
const rw1 = box(WALL_STEP_X, WALL_H_FRONT, 0.08, mat.glass);
rw1.position.set(WALL_STEP_X/2, WALL_H_FRONT/2, -0.04);
scene.add(rw1);
const rw2 = box(COURT_L - WALL_STEP_X, WALL_H_BACK, 0.08, mat.glass);
rw2.position.set(WALL_STEP_X + (COURT_L - WALL_STEP_X)/2, WALL_H_BACK/2, -0.04);
scene.add(rw2);

const oreilleRightMat = mat.oreille.clone();
const oreilleRight = box(WALL_STEP_X, oreilleH, 0.08, oreilleRightMat);
oreilleRight.position.set(WALL_STEP_X/2, WALL_H_BACK + oreilleH/2, -0.04);
scene.add(oreilleRight);

// ── Fraile ──
const fraileGeo = new THREE.BufferGeometry();
fraileGeo.setAttribute('position', new THREE.Float32BufferAttribute([
  0, 0, FRAILE_W,           FRAILE_W, 0, 0,           FRAILE_W, WALL_H_FRONT, 0,
  0, 0, FRAILE_W,           FRAILE_W, WALL_H_FRONT, 0, 0, WALL_H_FRONT, FRAILE_W,
], 3));
fraileGeo.computeVertexNormals();
const fraileMesh = new THREE.Mesh(fraileGeo, mat.fraile);
fraileMesh.castShadow = true;
scene.add(fraileMesh);

// ── Tejadillo ──
const netLen = NET_END - NET_START;
const tejWallBot = box(netLen, 0.95, 0.1, mat.tejWall);
tejWallBot.position.set(NET_START + netLen/2, 0.475, TEJ_Z);
scene.add(tejWallBot);

const netPlaneMat = mat.net.clone();
netPlaneMat.emissive = new THREE.Color(0x000000);
const netPlane = box(netLen, 0.85, 0.02, netPlaneMat);
netPlane.position.set(NET_START + netLen/2, 0.95 + 0.425, TEJ_Z);
scene.add(netPlane);

const roofGeo = new THREE.BufferGeometry();
roofGeo.setAttribute('position', new THREE.Float32BufferAttribute([
  0, TEJ_H_OUTER, TEJ_Z,         COURT_L, TEJ_H_OUTER, TEJ_Z,         COURT_L, TEJ_H_INNER, COURT_W,
  0, TEJ_H_OUTER, TEJ_Z,         COURT_L, TEJ_H_INNER, COURT_W,       0, TEJ_H_INNER, COURT_W,
], 3));
roofGeo.computeVertexNormals();
const roofMesh = new THREE.Mesh(roofGeo, mat.tejRoof);
scene.add(roofMesh);

// ── Balle ──
const ball = new THREE.Mesh(
  new THREE.SphereGeometry(0.06, 16, 16),
  new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x444444, roughness: 0.3 })
);
ball.castShadow = true;
scene.add(ball);

const trailPoints = [];
const trailGeo = new THREE.BufferGeometry();
const trailLine = new THREE.Line(trailGeo, new THREE.LineBasicMaterial({ color: 0xccff00, transparent: true, opacity: 0.5 }));
scene.add(trailLine);

// ── Physique & Trajectoire ──
let ballPos = new THREE.Vector3();
let ballVel = new THREE.Vector3();
let ballPath = [];
let ballTime = 0;
let isPaused = false;
let simSpeed = 1.0;
let isNetHit = false;
let isOreilleHit = false;
let isChapaHit = false; // Flag pour les chapas

function createSprite(text, pos, color, size) {
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = 128; canvas.height = 64;
  ctx.fillStyle = color; ctx.font = 'bold 48px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, 64, 32);
  const tex = new THREE.CanvasTexture(canvas);
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: 0.7 });
  const sp = new THREE.Sprite(mat);
  sp.position.set(...pos); sp.scale.set(size, size*0.5, 1);
  return sp;
}

const alertOreille = createSprite('OREILLE !', [4.5, 7.5, 4.65], '#ff4444', 3);
alertOreille.visible = false;
scene.add(alertOreille);

const alertFilet = createSprite('FILET !', [15, 2.5, TEJ_Z], '#ffaa44', 3);
alertFilet.visible = false;
scene.add(alertFilet);

// Ajout de l'alerte CHAPA
const alertChapa = createSprite('CHAPA !', [0, 5, 4.65], '#ffdd00', 3);
alertChapa.visible = false;
scene.add(alertChapa);

const shots = [
  { name: 'Service Court', es: 'Saque Corto', desc: 'Bute contre le frontis, tombe après le 10m.', p: [26, 0.8, 2], h: 178, v: 4, s: 22 },
  { name: 'Picada', es: 'Picada', desc: 'Coup sec vers le bas du frontis.', p: [20, 1.2, 5], h: 180, v: -10, s: 28 },
  { name: 'Xare', es: 'Xare', desc: 'Effet courbe vers les filets.', p: [15, 1.0, 4], h: 185, v: 8, s: 20 },
  { name: 'Rebote', es: 'Rebote', desc: 'Coup puissant vers le mur du fond.', p: [5, 0.7, 3], h: -2, v: 12, s: 30 },
];

let currentShotIdx = 0;

function launchShot(idx) {
  const s = shots[idx];
  currentShotIdx = idx;
  ballPos.set(s.p[0], s.p[1], s.p[2]);
  const ah = s.h * Math.PI / 180;
  const av = s.v * Math.PI / 180;
  ballVel.set(Math.cos(av)*Math.cos(ah), Math.sin(av), Math.cos(av)*Math.sin(ah)).multiplyScalar(s.s);
  ballPath = [];
  ballTime = 0;
  isNetHit = false;
  isOreilleHit = false;
  isChapaHit = false;
  alertOreille.visible = false;
  alertFilet.visible = false;
  alertChapa.visible = false;
  resetZones();
  updateEditorUI();
}

function updateTrajectory(dt) {
  if (isPaused) return;
  const steps = 5;
  const subDt = (dt * simSpeed) / steps;

  for (let i=0; i<steps; i++) {
    ballVel.y -= 9.81 * subDt;
    ballVel.multiplyScalar(1 - 0.01 * subDt);
    ballPos.add(ballVel.clone().multiplyScalar(subDt));

    // Collision Frontis (x=0)
    if (ballPos.x < 0.06) {
      ballPos.x = 0.06;
      ballVel.x *= -0.75;
      checkZoneHit(ballPos);
      
      // Détection Chapa Basse Frontis (0.80m - 1.00m)
      if (ballPos.y >= CHAPA_LOW && ballPos.y <= CHAPA_LOW + 0.20) {
        isChapaHit = true;
      }
      // Détection Chapa Haute Frontis (8.50m - 8.68m)
      if (ballPos.y >= CHAPA_HIGH && ballPos.y <= CHAPA_HIGH + 0.18) {
        isChapaHit = true;
      }
    }
    // Rebote (x=28.5)
    if (ballPos.x > COURT_L - 0.06) {
      ballPos.x = COURT_L - 0.06;
      ballVel.x *= -0.7;
      // Détection Chapa Rebote (5.50m)
      if (ballPos.y >= CHAPA_REBOTE && ballPos.y <= CHAPA_REBOTE + 0.18) {
        isChapaHit = true;
      }
    }
    // Sol
    if (ballPos.y < 0.06) {
      ballPos.y = 0.06;
      ballVel.y *= -0.65;
    }
    // Murs latéraux (z)
    if (ballPos.z < 0.06) {
      ballPos.z = 0.06; ballVel.z *= -0.7;
      // Chapa latérale droite (Rebote + Oreille)
      if (ballPos.x > WALL_STEP_X && Math.abs(ballPos.y - (CHAPA_REBOTE+0.09)) < 0.09) isChapaHit = true;
      if (ballPos.x <= WALL_STEP_X && Math.abs(ballPos.y - (WALL_H_FRONT+0.09)) < 0.09) isChapaHit = true;
    }
    if (ballPos.z > COURT_W - 0.06) {
      ballPos.z = COURT_W - 0.06; ballVel.z *= -0.7;
      // Chapa latérale gauche
      if (ballPos.x > WALL_STEP_X && Math.abs(ballPos.y - (CHAPA_REBOTE+0.09)) < 0.09) isChapaHit = true;
      if (ballPos.x <= WALL_STEP_X && Math.abs(ballPos.y - (WALL_H_FRONT+0.09)) < 0.09) isChapaHit = true;
    }

    // Oreilles (Collision proche de x=WALL_STEP_X)
    if (Math.abs(ballPos.x - WALL_STEP_X) < 0.15 && ballPos.y > WALL_H_BACK) {
      isOreilleHit = true;
    }

    // Filets (z=TEJ_Z, entre NET_START et NET_END)
    if (Math.abs(ballPos.z - TEJ_Z) < 0.1 && ballPos.x > NET_START && ballPos.x < NET_END && ballPos.y < TEJ_H_OUTER) {
      isNetHit = true;
    }
  }

  ball.position.copy(ballPos);
  ballPath.push(ballPos.clone());
  if (ballPath.length > 150) ballPath.shift();
  trailGeo.setFromPoints(ballPath);

  if (isOreilleHit) alertOreille.visible = (Math.floor(Date.now()/200)%2 === 0);
  if (isNetHit) alertFilet.visible = (Math.floor(Date.now()/200)%2 === 0);
  if (isChapaHit) {
    alertChapa.position.set(ballPos.x, ballPos.y + 0.5, ballPos.z);
    alertChapa.visible = (Math.floor(Date.now()/200)%2 === 0);
  }
}

// ── UI ──
const panel = document.getElementById('panel');
shots.forEach((s, i) => {
  const b = document.createElement('div');
  b.className = 'shot-btn';
  b.style.setProperty('--c', i === currentShotIdx ? '#4a7cff' : '#2a2d38');
  b.innerHTML = `<span class="name">${s.name} <span class="es">(${s.es})</span></span><span class="desc">${s.desc}</span>`;
  b.onclick = () => {
    document.querySelectorAll('.shot-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    launchShot(i);
  };
  panel.appendChild(b);
});

document.getElementById('replay').onclick = () => launchShot(currentShotIdx);
document.getElementById('pause').onclick = () => {
  isPaused = !isPaused;
  document.getElementById('pause').textContent = isPaused ? 'Reprendre' : 'Pause';
};
document.getElementById('speed').onclick = () => {
  simSpeed = simSpeed === 1.0 ? 0.3 : (simSpeed === 0.3 ? 2.0 : 1.0);
  document.getElementById('speed').textContent = `Vitesse : ${simSpeed}x`;
};

// ── Éditeur ──
const editToggle = document.getElementById('editToggle');
const editor = document.getElementById('editor');
editToggle.onclick = () => {
  editor.classList.toggle('visible');
  editToggle.classList.toggle('active');
};

function updateEditorUI() {
  const s = shots[currentShotIdx];
  document.getElementById('ed_pos_x').value = s.p[0];
  document.getElementById('ed_pos_y').value = s.p[1];
  document.getElementById('ed_pos_z').value = s.p[2];
  document.getElementById('ed_angle_h').value = s.h;
  document.getElementById('ed_angle_v').value = s.v;
  document.getElementById('ed_strength').value = s.s;
}

function pullEditorValuesIntoShot() {
  const s = shots[currentShotIdx];
  s.p[0] = parseFloat(document.getElementById('ed_pos_x').value);
  s.p[1] = parseFloat(document.getElementById('ed_pos_y').value);
  s.p[2] = parseFloat(document.getElementById('ed_pos_z').value);
  s.h = parseFloat(document.getElementById('ed_angle_h').value);
  s.v = parseFloat(document.getElementById('ed_angle_v').value);
  s.s = parseFloat(document.getElementById('ed_strength').value);
}

function applyEditorToCurrentShot() {
  pullEditorValuesIntoShot();
  launchShot(currentShotIdx);
}

let liveTimeout = null;
function scheduleLiveApply() {
  if (!document.getElementById('ed_live').checked) return;
  if (liveTimeout) clearTimeout(liveTimeout);
  liveTimeout = setTimeout(applyEditorToCurrentShot, 50);
}

// ── Initialisation & Boucle ──
launchShot(0);

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  updateTrajectory(dt);
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Caméras
document.querySelectorAll('[data-cam]').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('[data-cam]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const type = btn.getAttribute('data-cam');
    if (type === 'default') { camera.position.set(30, 13, 0); controls.target.set(10, 2, 5); }
    if (type === 'side') { camera.position.set(14, 4, -15); controls.target.set(14, 2, 5); }
    if (type === 'player') { camera.position.set(30, 1.7, 4.6); controls.target.set(0, 1.7, 4.6); }
    if (type === 'gallery') { camera.position.set(14, 2.5, 9); controls.target.set(0, 1, 4.6); }
  };
});

</script>
</body>
</html>
